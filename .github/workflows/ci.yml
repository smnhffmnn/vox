name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: macOS
            binary: vox
          - runner: ubuntu-latest
            name: Linux
            binary: vox
          - runner: windows-latest
            name: Windows
            binary: vox.exe
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.name }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Test
        run: go test ./...

      # Race detector only on Linux: worthwhile because app.go has real
      # concurrency (recordingMu, doubletapTimer, handsfreeTimer, atomic.Uint64),
      # and Linux is fast + stable for -race. macOS -race is slow and flaky on
      # audio/timer code; Windows -race with CGO adds little over Linux.
      - name: Test (race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -ldflags "-s -w -X main.version=${VERSION}" -o ${{ matrix.binary }} .

      - name: Verify binary
        run: |
          ./${{ matrix.binary }} --version | grep -q "vox"
          echo "Binary verification passed"

  # The headless release artifact (-tags nogui, no GTK/WebKit) is built here
  # the way release.yml builds it — plain runner, no Node, no frontend, no
  # GTK packages, the release ldflags — on both Linux architectures, so a
  # change that breaks the tag fails the PR. Running the tests under the tag
  # covers what the desktop job cannot: the nogui files and their build
  # constraints. The ldd guard is the artifact's promise: no desktop stack.
  headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: headless (linux ${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet (nogui)
        run: go vet -tags nogui ./...

      - name: Test (nogui)
        run: go test -tags nogui ./...

      # Same command as release.yml's "Build binary" for the headless entries.
      - name: Build (release command)
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          go build -tags nogui \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o vox .

      - name: Verify binary
        run: |
          test "$(./vox --version)" = "vox ${VERSION}"
          if ldd ./vox | grep -Eiq 'gtk|webkit'; then
            echo "headless binary links GTK/WebKit"
            ldd ./vox
            exit 1
          fi
          echo "Headless binary verification passed"
