name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The release starts as a draft and goes public in the publish job, after
  # every archive and SHA256SUMS are on it — a visitor never sees a release
  # with half its assets. gh finds a draft by its tag name for upload,
  # download and edit.
  #
  # When a build job fails, the draft stays:
  # - Cause outside the repository (runner, network, token): re-run the
  #   failed jobs. The uploads use --clobber; checksums, publish and homebrew
  #   follow.
  # - Cause that needs a commit: a re-run builds the same commit again. Move
  #   the tag to the fixed commit and push it; create-release reuses the
  #   draft, and the uploads replace its archives.
  # A tag whose release is already published is never built again:
  # create-release stops the run, so "Re-run all jobs" cannot replace
  # published archives or rewrite their hashes. A homebrew job that failed
  # after publish is re-run on its own (gh run rerun <id> --failed).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or reuse the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ERR="$RUNNER_TEMP/gh.err"
          # GitHub accepts a draft for a tag that already has a published
          # release, and any number of drafts per tag; gh then picks one of
          # them for each upload. So the state is checked first. The tags
          # endpoint returns published releases only.
          if url=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .html_url 2>"$ERR"); then
            echo "::error::${TAG} is already published (${url}) — not building it again"
            exit 1
          elif ! grep -q 'HTTP 404' "$ERR"; then
            cat "$ERR"
            exit 1
          fi
          # With the published case ruled out, a release gh finds is a draft
          # from an earlier run of this tag.
          if gh release view "$TAG" --repo "$REPO" --json isDraft >/dev/null 2>"$ERR"; then
            echo "Reusing the draft release of ${TAG}"
            exit 0
          elif ! grep -qx 'release not found' "$ERR"; then
            cat "$ERR"
            exit 1
          fi
          gh release create "$TAG" --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --draft \
            --target "$GITHUB_SHA"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: vox
            archive: tar.gz
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary: vox.exe
            archive: zip
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: vox
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: vox
            archive: tar.gz
          # Headless (-tags nogui): the transcribe CLI without the desktop
          # app, so without GTK/WebKit — for servers without a display.
          # Archive name vox-headless_<version>_linux_<arch>.tar.gz, the
          # binary inside is still called vox.
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: vox
            archive: tar.gz
            variant: headless
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: vox
            archive: tar.gz
            variant: headless
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        if: matrix.variant != 'headless'
        with:
          node-version: 22

      - name: Set build variables
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NAME=vox
          BUILD_TAGS=""
          if [ "${{ matrix.variant }}" = "headless" ]; then
            NAME=vox-headless
            BUILD_TAGS="-tags nogui"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD_TAGS=${BUILD_TAGS}" >> $GITHUB_ENV
          echo "ARCHIVE_BASE=${NAME}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: Install Linux dependencies
        if: matrix.goos == 'linux' && matrix.variant != 'headless'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build frontend
        if: matrix.variant != 'headless'
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build binary
        run: |
          go build ${{ env.BUILD_TAGS }} \
            -ldflags "-s -w -X main.version=${{ env.VERSION }}" \
            -o ${{ matrix.binary }} .

      - name: Verify binary
        run: |
          # The version stamp must be the tag's: a binary that says "dev"
          # was built without the ldflags and must not ship.
          test "$(./${{ matrix.binary }} --version)" = "vox ${{ env.VERSION }}"
          if [ "${{ matrix.variant }}" = "headless" ]; then
            # The artifact's promise is a binary that runs on a server without
            # a desktop stack — fail the release if GTK or WebKit sneaked in.
            if ldd ./${{ matrix.binary }} | grep -Eiq 'gtk|webkit'; then
              echo "headless binary links GTK/WebKit"
              ldd ./${{ matrix.binary }}
              exit 1
            fi
          fi

      - name: Create archive
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a ${{ env.ARCHIVE_BASE }}.zip ${{ matrix.binary }} LICENSE
          else
            tar czf ${{ env.ARCHIVE_BASE }}.tar.gz ${{ matrix.binary }} LICENSE
          fi

      - name: Create macOS .app bundle
        if: matrix.goos == 'darwin'
        run: |
          mkdir -p vox.app/Contents/MacOS
          mkdir -p vox.app/Contents/Resources

          cp vox vox.app/Contents/MacOS/vox
          sed "s/1.0.0/${{ env.VERSION }}/g" build/darwin/Info.plist > vox.app/Contents/Info.plist

          mkdir -p /tmp/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size build/appicon.png --out /tmp/icon.iconset/icon_${size}x${size}.png 2>/dev/null
          done
          sips -z 32 32 build/appicon.png --out /tmp/icon.iconset/icon_16x16@2x.png 2>/dev/null
          sips -z 64 64 build/appicon.png --out /tmp/icon.iconset/icon_32x32@2x.png 2>/dev/null
          sips -z 256 256 build/appicon.png --out /tmp/icon.iconset/icon_128x128@2x.png 2>/dev/null
          sips -z 512 512 build/appicon.png --out /tmp/icon.iconset/icon_256x256@2x.png 2>/dev/null
          sips -z 1024 1024 build/appicon.png --out /tmp/icon.iconset/icon_512x512@2x.png 2>/dev/null
          iconutil -c icns /tmp/icon.iconset -o vox.app/Contents/Resources/appicon.icns
          rm -rf /tmp/icon.iconset

          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile appicon" vox.app/Contents/Info.plist

          tar czf vox_${{ env.VERSION }}_darwin_${{ matrix.goarch }}_app.tar.gz vox.app

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            gh release upload ${{ github.ref_name }} \
              ${{ env.ARCHIVE_BASE }}.zip --clobber
          else
            gh release upload ${{ github.ref_name }} \
              ${{ env.ARCHIVE_BASE }}.tar.gz --clobber
          fi

      - name: Upload .app bundle
        if: matrix.goos == 'darwin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            vox_${{ env.VERSION }}_darwin_${{ matrix.goarch }}_app.tar.gz --clobber

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate SHA256 checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/assets && cd /tmp/assets
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --pattern '*.tar.gz' --pattern '*.zip'
          sha256sum * | sort > SHA256SUMS
          gh release upload ${{ github.ref_name }} SHA256SUMS \
            --repo ${{ github.repository }} --clobber

  publish:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.ref_name }} \
            --repo ${{ github.repository }} --draft=false

  # After publish: the formula points at the public download URLs, and the
  # hashes it carries are checked against SHA256SUMS before they are written
  # — a 404 page or a truncated download never becomes a formula hash.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          REPO="${{ github.repository }}"
          DOWNLOAD="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"
          FORMULA_FILE="vox_${VERSION}_darwin_arm64.tar.gz"
          CASK_FILE="vox_${VERSION}_darwin_arm64_app.tar.gz"
          FORMULA_URL="${DOWNLOAD}/${FORMULA_FILE}"
          CASK_URL="${DOWNLOAD}/${CASK_FILE}"

          # Retried: the download URLs answer right after publish, but a
          # short 404 or 5xx there must not fail the tap update.
          for url in "$FORMULA_URL" "$CASK_URL" "${DOWNLOAD}/SHA256SUMS"; do
            curl -fsSLO --retry 5 --retry-all-errors "$url"
          done
          # Exact name match: a file that SHA256SUMS does not list would be
          # skipped by --ignore-missing and reach the formula unchecked.
          for f in "$FORMULA_FILE" "$CASK_FILE"; do
            awk -v f="$f" '$2 == f { found = 1 } END { exit !found }' SHA256SUMS \
              || { echo "${f} is not in SHA256SUMS"; exit 1; }
          done
          sha256sum -c --ignore-missing SHA256SUMS

          FORMULA_SHA=$(sha256sum "$FORMULA_FILE" | cut -d' ' -f1)
          CASK_SHA=$(sha256sum "$CASK_FILE" | cut -d' ' -f1)

          git clone https://x-access-token:${TAP_TOKEN}@github.com/smnhffmnn/homebrew-tap.git tap
          cd tap

          cat > Formula/vox.rb << FORMULA
          class Vox < Formula
            desc "Cross-platform speech-to-text dictation tool"
            homepage "https://github.com/smnhffmnn/vox"
            version "${VERSION}"
            license "MIT"

            depends_on :macos
            depends_on arch: :arm64

            url "${FORMULA_URL}"
            sha256 "${FORMULA_SHA}"

            def install
              bin.install "vox"
            end

            test do
              assert_match "vox", shell_output("#{bin}/vox --version", 0)
            end
          end
          FORMULA

          mkdir -p Casks
          cat > Casks/vox.rb << CASK
          cask "vox" do
            version "${VERSION}"
            sha256 "${CASK_SHA}"

            url "${CASK_URL}"
            name "Vox"
            desc "Cross-platform speech-to-text dictation tool"
            homepage "https://github.com/smnhffmnn/vox"

            depends_on arch: :arm64

            app "vox.app"

            zap trash: [
              "~/.config/vox",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vox.rb Casks/vox.rb
          git commit -m "Update vox to ${VERSION}" || true
          git push
